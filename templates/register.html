{% extends "base.html" %}
{% block content %}
<div class="auth-wrapper">
    <div class="card shadow border-0">
        <div class="card-header auth-header text-center py-4">
            <h4 class="mb-1 text-white"><i class="fas fa-hospital-user me-2"></i> Register Account</h4>
            <p class="text-white-50 small mb-0">Select your professional role in the pharmacy / medical facility</p>
        </div>
        <div class="card-body p-4">
            <form action="{{ url_for('register') }}" method="POST">
                <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" class="form-control" id="name" name="name" placeholder="Dr. John Doe / Nurse Jane" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="user@hospital.org" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="role" class="form-label">Access Role / Department</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-id-badge"></i></span>
                        <select class="form-select" id="role" name="role" required>
                            <option value="pharmacist" selected>Pharmacist / Inventory Manager (Full Stock Management)</option>
                            <option value="admin">Administrator / Administration (Full System Access & Users)</option>
                            <option value="staff">Clinical Staff / Nurse (Day-to-day Logging & Stock Updates)</option>
                            <option value="viewer">Doctor / Medical Auditor (Read-Only & Search)</option>
                        </select>
                    </div>
                    <div class="form-text small">Role determines your editing permissions and access to admin settings.</div>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Minimum 6 characters" required minlength="6">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2"><i class="fas fa-check-circle me-1"></i> Create Account</button>
            </form>
            <div class="text-center mt-3">
                <p class="mb-0 text-muted small">Already registered? <a href="{{ url_for('login') }}" class="text-decoration-none fw-semibold">Sign in here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
