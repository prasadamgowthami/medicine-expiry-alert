{% extends "base.html" %}
{% block content %}
<div class="auth-wrapper">
    <div class="card shadow border-0">
        <div class="card-header auth-header text-center py-4">
            <h4 class="mb-1 text-white"><i class="fas fa-lock me-2"></i> Clinical Portal Login</h4>
            <p class="text-white-50 small mb-0">Medicine Expiry & Inventory Alert System</p>
        </div>
        <div class="card-body p-4">
            <form action="{{ url_for('login') }}" method="POST">
                <div class="mb-3">
                    <label for="email" class="form-label">Work Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="name@domain.com" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-key"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2"><i class="fas fa-sign-in-alt me-1"></i> Sign In to Portal</button>
            </form>
            
            <div class="alert alert-light border mt-4 p-2 text-muted small text-center">
                <i class="fas fa-user-shield text-info me-1"></i> Role-based portal for <strong>Admin</strong>, <strong>Pharmacist</strong>, <strong>Staff</strong> & <strong>Doctors</strong>.
            </div>

            <div class="text-center mt-3">
                <p class="mb-0 text-muted small">New staff member? <a href="{{ url_for('register') }}" class="text-decoration-none fw-semibold">Register account here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
