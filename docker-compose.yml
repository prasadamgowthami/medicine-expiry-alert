version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: medalert_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: medicine_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - medalert_net

  web:
    build: .
    container_name: medalert_web
    restart: always
    depends_on:
      - db
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpassword123
      DB_NAME: medicine_db
      SECRET_KEY: enterprise-production-secret-key-2026
    networks:
      - medalert_net

volumes:
  mysql_data:

networks:
  medalert_net:
    driver: bridge
